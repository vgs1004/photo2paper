name: Make papercraft

# Three ways in:
#  - the web page (docs/index.html, served by GitHub Pages) uploads
#    photos/<name>.jpg plus photos/<name>.json with size / detail / paper
#  - Add file -> Upload files into photos/ on github.com (default settings)
#  - Actions tab -> Run workflow with an image link
# Each builds papercraft/<name>.pdf and commits it.
on:
  push:
    paths:
      - "photos/**"
  workflow_dispatch:
    inputs:
      image_url:
        description: "Link to a photo (jpg/png/webp)"
        required: true
      name:
        description: "Short name for the model, e.g. headphones"
        required: true
      faces:
        description: "Number of flat faces (fewer = easier to build)"
        default: "150"
      size:
        description: "Longest side of the finished model, in mm"
        default: "150"
      paper:
        description: "Paper size"
        type: choice
        options: [A4, A3, Letter]
        default: A4

permissions:
  contents: write

concurrency:
  group: papercraft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}   # optional: bigger free GPU quota
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch photo from link
        if: github.event_name == 'workflow_dispatch'
        env:
          URL: ${{ inputs.image_url }}
          NAME: ${{ inputs.name }}
        run: |
          safe=$(printf '%s' "$NAME" | tr -c 'A-Za-z0-9_-' '_' | sed 's/_*$//')
          curl -fsSL --max-filesize 20000000 -o "photos/$safe.img" "$URL"
          type=$(file -b --mime-type "photos/$safe.img")
          case "$type" in
            image/jpeg) ext=jpg ;; image/png) ext=png ;; image/webp) ext=webp ;;
            *) echo "::error::That link is not a jpg/png/webp image ($type)"; exit 1 ;;
          esac
          mv "photos/$safe.img" "photos/$safe.$ext"
          echo "photos/$safe.$ext" > todo.txt

      - name: Find new photos
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --no-commit-id --name-only --diff-filter=AM -r HEAD -- photos > changed.txt
          else
            git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- photos > changed.txt
          fi
          # a photo counts if it changed, or if only its settings file changed
          : > todo.txt
          while IFS= read -r f; do
            case "$f" in
              *.json)
                for e in jpg jpeg png webp JPG JPEG PNG WEBP; do
                  [ -f "${f%.json}.$e" ] && echo "${f%.json}.$e" >> todo.txt
                done ;;
              *.jpg|*.jpeg|*.png|*.webp|*.JPG|*.JPEG|*.PNG|*.WEBP)
                echo "$f" >> todo.txt ;;
            esac
          done < changed.txt
          sort -u -o todo.txt todo.txt
          echo "Photos to process:"; cat todo.txt

      - name: Build papercraft PDFs
        env:
          FACES: ${{ inputs.faces || '150' }}
          SIZE: ${{ inputs.size || '150' }}
          PAPER: ${{ inputs.paper || 'A4' }}
        run: |
          mkdir -p papercraft
          status=0
          while IFS= read -r photo; do
            [ -f "$photo" ] || continue
            name=$(basename "${photo%.*}")
            echo "::group::$photo"
            # photos/<name>.json, if present, overrides these defaults
            if python photo2paper.py "$photo" --faces "$FACES" --size "$SIZE" --paper "$PAPER" \
                 --out "papercraft/$name.pdf" | tee run.log; then
              echo "- [$name.pdf](papercraft/$name.pdf) from \`$photo\`: $(grep -m1 'faces in' run.log)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- **$photo failed** (see log; usually the free AI quota, add an HF_TOKEN secret)" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
            echo "::endgroup::"
          done < todo.txt
          exit $status
        shell: bash -o pipefail -e {0}

      - name: Save PDFs to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add photos papercraft/*.pdf 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Add papercraft PDF(s)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: papercraft
          path: |
            papercraft/*.pdf
            papercraft/*_3d.glb
          if-no-files-found: ignore
